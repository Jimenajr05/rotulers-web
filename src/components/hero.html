<script>
  (function () {
    const canvas = document.getElementById('hero-particles');
    if (!canvas || !canvas.getContext) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = 1;
    let particles = [];
    let resizeTimer;

    const particleCount = () => {
      if (window.innerWidth < 640) return 16;
      if (window.innerWidth < 1024) return 30;
      return 48;
    };

    class Particle {
      constructor(init = true) {
        this.reset(init);
      }
      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : height + Math.random() * 18;
        this.size = Math.random() * 1.8 + 0.6;
        this.speedX = Math.random() * 0.28 - 0.14;
        this.speedY = -(Math.random() * 0.28 + 0.14);
        this.opacity = Math.random() * 0.28 + 0.1;
        this.color = Math.random() > 0.78 ? '255, 209, 0' : '30, 111, 255';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -26 || this.x < -26 || this.x > width + 26) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
        ctx.shadowBlur = this.size * 2.5;
        ctx.shadowColor = `rgba(${this.color}, ${this.opacity * 0.9})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      particles = Array.from({ length: particleCount() }, () => new Particle(true));
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      requestAnimationFrame(animate);
    }

    resizeCanvas();
    animate();

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvas, 120);
    });
  })();
</script>
